openapi: 3.1.0
info:
  title: Grok Hack Wrocław games API
  version: 0.1.0
  description: |
    Backend contract for generated learning games. The TypeScript schemas in
    `packages/api-contract` are the source of truth. This document mirrors them.
    POST /api/games returns 202 and finishes in the background. A ready gameUrl
    is GET /play/{id}, which serves a Phaser 3 page as text/html.
servers:
  - url: http://localhost:3001
    description: Local `npm run dev`
tags:
  - name: games
  - name: meta
paths:
  /api/health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Process health and which store is active
      responses:
        '200':
          description: The API process is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          description: Unexpected failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    options:
      tags: [meta]
      operationId: optionsHealth
      summary: CORS preflight
      responses:
        '204':
          description: CORS headers only.
  /api/games:
    post:
      tags: [games]
      operationId: createGame
      summary: Create a game from a learning goal and a child's description
      description: |
        Validates the body, stores a queued game, and schedules generation.
        Poll `GET /api/games/{id}` until `ready` or `failed`. `202` means the
        row was stored. Read `status`. When ready, `gameUrl` is `GET /play/{id}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameRequest'
            example:
              parentPrompt: 'Ułamki zwykłe: dodawanie o tym samym mianowniku.'
              childPrompt: 'Gra platformowa, w której zbieram monety-ułamki.'
              childAge: 10
              language: pl
      responses:
        '202':
          description: Game row stored with status queued. Inspect `status` on GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          description: Body was not JSON, or it failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: The row could not be stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    options:
      tags: [games]
      operationId: optionsGames
      summary: CORS preflight
      responses:
        '204':
          description: CORS headers only.
  /api/games/{id}:
    get:
      tags: [games]
      operationId: getGame
      summary: Fetch one game, including generation status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          description: "id is not a UUID."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No game with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: The store could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    options:
      tags: [games]
      operationId: optionsGame
      summary: CORS preflight
      responses:
        '204':
          description: CORS headers only.
  /api/games/{id}/results:
    post:
      tags: [games]
      operationId: postGameResult
      summary: Store the score from the end screen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameResultRequest'
      responses:
        '200':
          description: Result stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResultResponse'
        '400':
          description: The id or the body failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No game with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /play/{id}:
    get:
      tags: [games]
      operationId: playGame
      summary: Serve the Phaser game as HTML
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: assets
          in: query
          required: false
          schema:
            type: string
            enum: [shapes]
          description: When `shapes`, image URLs are omitted for this response only.
      responses:
        '200':
          description: HTML. A ready game is playable. Other statuses explain themselves.
          content:
            text/html:
              schema:
                type: string
        '400':
          description: The id is not a UUID.
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Unknown game, or a ready game with no spec.
          content:
            text/html:
              schema:
                type: string
components:
  schemas:
    CreateGameRequest:
      type: object
      additionalProperties: false
      required: [parentPrompt, childPrompt]
      properties:
        parentPrompt:
          type: string
          minLength: 1
          maxLength: 4000
          description: What the parent or teacher wants the child to learn.
        childPrompt:
          type: string
          minLength: 1
          maxLength: 4000
          description: The game the child asked for, already transcribed if they spoke.
        childAge:
          type: integer
          minimum: 3
          maximum: 18
        language:
          type: string
          minLength: 2
          maxLength: 16
          description: BCP 47 language tag, for example `pl` or `en`.
        questionCount:
          type: integer
          minimum: 1
          maximum: 10
          description: How many tasks to play. The Phaser page plays 3 to 10.
        template:
          type: string
          enum: [collect, runner, quiz, quiz_battle]
          description: Kid-picked game type. `quiz_battle` is stored as `quiz`.
        tasks:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/CreateGameTask'
    CreateGameTask:
      type: object
      additionalProperties: false
      required: [id, question, answer, distractors, difficulty]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        question:
          type: string
          minLength: 1
          maxLength: 280
        answer:
          type: string
          minLength: 1
          maxLength: 80
        distractors:
          type: array
          minItems: 2
          maxItems: 3
          items:
            type: string
            minLength: 1
            maxLength: 80
        difficulty:
          type: integer
          minimum: 1
          maximum: 3
        skill:
          type: string
          minLength: 1
          maxLength: 80
    GameStatus:
      type: string
      enum: [queued, generating, ready, failed]
    GameTemplate:
      type: string
      enum: [collect, runner, quiz]
    GameResultRequest:
      type: object
      additionalProperties: false
      required: [score, total, correct]
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 1000
        total:
          type: integer
          minimum: 1
          maximum: 100
        correct:
          type: integer
          minimum: 0
          maximum: 100
        durationMs:
          type: integer
          minimum: 0
          maximum: 3600000
    GameResultResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
    GameGraphics:
      type: object
      required: [thumbnailUrl, coverUrl, assetUrls]
      properties:
        thumbnailUrl:
          type: [string, 'null']
        coverUrl:
          type: [string, 'null']
        assetUrls:
          type: array
          items:
            type: string
            minLength: 1
    Game:
      type: object
      required:
        - id
        - parentPrompt
        - childPrompt
        - childAge
        - language
        - status
        - template
        - gameUrl
        - graphics
        - error
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        parentPrompt:
          type: string
        childPrompt:
          type: string
        childAge:
          type: [integer, 'null']
        language:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/GameStatus'
        template:
          oneOf:
            - $ref: '#/components/schemas/GameTemplate'
            - type: 'null'
          description: Null until generation has chosen a template.
        gameUrl:
          type: [string, 'null']
          description: Absolute GET /play/{id} URL. Null until status is ready.
        graphics:
          $ref: '#/components/schemas/GameGraphics'
        error:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FieldError:
      type: object
      required: [path, message]
      properties:
        path:
          type: string
        message:
          type: string
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_json, validation_error, not_found, internal_error]
            message:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/FieldError'
    Health:
      type: object
      required: [ok, service, storage]
      properties:
        ok:
          type: boolean
          const: true
        service:
          type: string
          const: games-api
        storage:
          type: string
          enum: [memory, supabase]
