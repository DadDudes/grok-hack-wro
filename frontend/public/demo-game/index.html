<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EduBotGames demo game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="game.css" />
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="sky">
      <p class="question" id="question" aria-live="polite">Getting the tasks ready...</p>
      <section class="answers" id="answers" aria-label="Pick the right answer"></section>
      <img class="mascot" src="../brand/agents/robo-head.svg" alt="" />
      <p class="bubble" id="bubble" hidden></p>
      <section class="done" id="done" hidden>
        <p>All done! Great team!</p>
      </section>
    </main>
  </body>
</html>
